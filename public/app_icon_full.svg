<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Navy APK Container Background -->
  <rect width="512" height="512" rx="108" fill="#0B1220" />

  <!-- Bold Glowing APK P-Arrow Chart Mark -->
  <g transform="translate(-135.5, -88.25) scale(1.35)" filter="url(#glow)">
    <!-- Loop & Stem of the P -->
    <path
      d="M 185 150 H 290 C 330 150 360 180 360 220 C 360 260 330 290 290 290 H 185 V 360"
      stroke="url(#logo-gradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Zigzag Chart Line ending in Arrow -->
    <path
      d="M 185 340 L 255 260 L 305 310 L 395 220"
      stroke="url(#logo-gradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Arrow Head -->
    <path
      d="M 335 220 H 395 V 280"
      stroke="url(#logo-gradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
