<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C30" />
      <stop offset="100%" stop-color="#080D17" />
    </linearGradient>
    <linearGradient id="fav-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast rounded container with subtle emerald ring -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#fav-bg)" stroke="#10B981" stroke-width="16" stroke-opacity="0.4" />

  <!-- Glowing P Logo & Growth Chart Arrow with standard XML attributes -->
  <g filter="url(#fav-glow)">
    <!-- P Loop & Stem -->
    <path
      d="M 175 145 H 290 C 335 145 365 175 365 215 C 365 255 335 285 290 285 H 175 V 365"
      stroke="url(#fav-green)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upward Trend Zigzag Line -->
    <path
      d="M 175 345 L 250 260 L 305 315 L 395 220"
      stroke="url(#fav-green)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Trend Arrow Tip -->
    <path
      d="M 335 220 H 395 V 280"
      stroke="url(#fav-green)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>